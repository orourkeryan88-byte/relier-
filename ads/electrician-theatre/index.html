<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Southline electricians ad</title>
<style>
  @font-face { font-family: Inter; src: url(fonts/Inter-Regular.otf); font-weight: 400; }
  @font-face { font-family: Inter; src: url(fonts/Inter-Medium.otf); font-weight: 500; }
  @font-face { font-family: Inter; src: url(fonts/Inter-SemiBold.otf); font-weight: 600; }
  @font-face { font-family: Inter; src: url(fonts/Inter-Bold.otf); font-weight: 700; }
  @font-face { font-family: Inter; src: url(fonts/Inter-ExtraBold.otf); font-weight: 800; }
  @font-face { font-family: Inter; src: url(fonts/Inter-Black.otf); font-weight: 900; }
  :root { --ink: #eef3f0; --muted: #a0bcaf; --gold: #e5a64f; --gold2: #ffd896; --red: #e84848; }
  html, body { margin: 0; background: #05120e; }
  body { width: 1080px; height: 1920px; overflow: hidden; font-family: Inter, sans-serif; color: var(--ink);
         -webkit-font-smoothing: antialiased; letter-spacing: -0.02em; }
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
  .abs { position: absolute; }
  .layer { position: absolute; left: 540px; top: 960px; width: 1080px; height: 1920px; }
  .cam { position: absolute; left: 540px; top: 960px; width: 1080px; height: 1920px; }
  .line { position: absolute; white-space: nowrap; text-align: center; line-height: 1.12; }
  .w { display: inline-block; will-change: transform; transform-origin: 50% 80%; }
  .gold { color: transparent; -webkit-background-clip: text; background-clip: text;
          background-image: linear-gradient(100deg, transparent 42%, rgba(255,250,235,.95) 50%, transparent 58%),
                            linear-gradient(180deg, #ffe6b2 0%, #f2b45c 52%, #c98633 100%);
          background-size: 320% 100%, 100% 100%; background-position: 120% 0, 0 0; background-repeat: no-repeat; padding: 0 .04em; }
  .muted { color: var(--muted); }
  .pill { border-radius: 999px; padding: 0 1.1em; height: 2.1em; display: flex; align-items: center; justify-content: center;
          font-weight: 700; white-space: nowrap; overflow: hidden; }
  .shine::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
          background: linear-gradient(105deg, transparent 38%, rgba(255,255,255,.55) 50%, transparent 62%);
          background-size: 300% 100%; background-repeat: no-repeat; background-position: var(--shp, 130%) 0; }
  .glass { background: rgba(8, 20, 16, .45); border: 1.5px solid rgba(255,255,255,.14); backdrop-filter: blur(18px);
           box-shadow: 0 20px 50px -20px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.08); }
  .goldfill { background: linear-gradient(180deg, #ffe0a6, #e5a64f 60%, #cf8c37); color: #1f1406;
              box-shadow: 0 16px 40px -12px rgba(229,166,79,.55), inset 0 1px 0 rgba(255,255,255,.5); }
  .led { color: transparent; -webkit-background-clip: text; background-clip: text;
         background-image: radial-gradient(circle, #ffd590 0 3.1px, transparent 3.7px); background-size: 11px 11px;
         font-weight: 900; line-height: 1.0; }
  .bubble { position: absolute; font-weight: 500; font-size: 42px; padding: 0 42px; height: 112px; display: flex; align-items: center;
            border-radius: 46px; white-space: nowrap; box-shadow: 0 18px 40px -18px rgba(0,0,0,.7); }
  .in  { background: #f0f3f1; color: #111; transform-origin: 0% 100%; }
  .out { background: linear-gradient(180deg, #ffd99a, #e5a64f); color: #1c1307; transform-origin: 100% 100%; }
  .dot { width: 20px; height: 20px; border-radius: 50%; background: #8a8f8c; display: inline-block; margin: 0 6px; }
  .chip { height: 88px; padding: 0 36px; border-radius: 44px; display: flex; align-items: center; font-weight: 700; font-size: 40px;
          white-space: nowrap; box-shadow: 0 14px 30px -12px rgba(0,0,0,.7); }
  .chip.good { background: linear-gradient(180deg, #ffdea0, #e5a64f 60%, #cf8c37); color: #1f1406; }
  .chip.bad  { background: #33433d; color: #b9cbc3; border: 1.5px solid rgba(255,255,255,.08); }
  .card { width: 660px; height: 330px; border-radius: 40px; padding: 44px; box-sizing: border-box; overflow: hidden;
          box-shadow: 0 40px 80px -30px rgba(0,0,0,.75); transform-style: preserve-3d; }
  .card .lab { font-size: 30px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; opacity: .6; }
  .card .big { white-space: nowrap; font-size: 100px; font-weight: 800; letter-spacing: -.04em; line-height: 1.1; margin-top: 6px; }
  .card .sm  { font-size: 36px; font-weight: 600; margin-top: 4px; }
  .cream { background: linear-gradient(180deg, #fbfaf6, #ece8df); color: #121512; }
  .spark { position: absolute; border-radius: 50%; background: radial-gradient(circle, #fff2d0 0%, #ffcf80 35%, rgba(255,190,90,0) 70%); }
</style>
</head>
<body>
<div id="stage"></div>
<script src="bundle.js"></script>
</body>
</html>
